name: Render en varias maquinas

on:
  push:
    branches: [main]
    paths: ["trabajos/ACTUAL.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      trozos: ${{ steps.p.outputs.trozos }}
      nombre: ${{ steps.p.outputs.nombre }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: trabajos }
      - id: p
        run: |
          python3 -c "import json;d=json.load(open('trabajos/ACTUAL.json'));print('trozos='+json.dumps([t['id'] for t in d['trozos']]));print('nombre='+d['nombre'])" >> "$GITHUB_OUTPUT"

  trozo:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.trozos) }}
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: herramientas/requisitos.txt }
      - name: Programas del sistema (guardados en memoria)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with: { packages: libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 ffmpeg, version: "1" }
      - name: Planes de Max ya calculados (de renders anteriores)
        uses: actions/cache@v4
        with:
          path: hc/max_ropa/motor/soma/planes_guardados
          key: planes-${{ github.run_id }}-${{ matrix.id }}
          restore-keys: planes-
      - name: Preparar maquina
        run: |
          pip install -q -r herramientas/requisitos.txt
          sudo ln -sfn "$GITHUB_WORKSPACE/hc" /home/claude
          T=$(( $(date +%s) - T0 )); echo "T_PREPARAR=$T" >> "$GITHUB_ENV"; echo "preparada en $T s"
      - name: Renderizar trozo ${{ matrix.id }}
        env:
          MUJOCO_GL: egl
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          FUENTE: ${{ github.workspace }}/fuentes/Inter-Black.otf
        run: python3 herramientas/trozo.py trabajos/ACTUAL.json ${{ matrix.id }} salida/${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with: { name: "trozo-${{ matrix.id }}", path: "salida/${{ matrix.id }}", retention-days: 3 }

  unir:
    needs: [plan, trozo]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: salida, pattern: "trozo-*" }
      - name: Unir el video
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          python3 herramientas/unir.py trabajos/ACTUAL.json salida resultado
      - name: Guardar en la rama resultados
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv resultado /tmp/resultado
          if git fetch -q --depth=1 origin +refs/heads/resultados:refs/remotes/origin/resultados; then
            git checkout -q -f -B resultados origin/resultados
          else
            git checkout -q --orphan resultados; git rm -rqf --cached . > /dev/null 2>&1 || true
          fi
          mv /tmp/resultado resultado
          mkdir -p "${{ needs.plan.outputs.nombre }}"; cp resultado/* "${{ needs.plan.outputs.nombre }}/"
          git add "${{ needs.plan.outputs.nombre }}"; git commit -qm "Resultado ${{ needs.plan.outputs.nombre }} [skip ci]"
          git push -q origin resultados
