name: Teletransporte en 20 maquinas

on:
  push:
    branches: [main]
    paths: ["trabajos/TP.json"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: teletransporte
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      trozos: ${{ steps.p.outputs.trozos }}
      nombre: ${{ steps.p.outputs.nombre }}
      modo: ${{ steps.p.outputs.modo }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: trabajos }
      - id: p
        run: |
          python3 -c "import json;d=json.load(open('trabajos/TP.json'));print('trozos='+json.dumps([t['id'] for t in d['trozos']]));print('nombre='+d['nombre']);print('modo='+d.get('modo','render'))" >> "$GITHUB_OUTPUT"

  trozo:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.trozos) }}
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { sparse-checkout: "herramientas\ntrabajos" }
      - uses: actions/checkout@v4
        with: { ref: proyecto-tp, path: zipsf }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: herramientas/req_tp.txt }
      - name: Programas del sistema (guardados en memoria)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with: { packages: libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 libgl1 libglx-mesa0, version: "tp1" }
      - name: Preparar maquina (librerias + proyecto en /home/claude)
        run: |
          pip install -q -r herramientas/req_tp.txt &
          cat zipsf/tp.zip.* > /tmp/sf.zip
          echo "$(tail -1 zipsf/SHA256.txt | cut -d' ' -f1)  /tmp/sf.zip" | sha256sum -c
          sudo mkdir -p /home/claude && sudo chown "$(id -u):$(id -g)" /home/claude
          unzip -q -n /tmp/sf.zip -d /home/claude && rm -f /tmp/sf.zip && rm -rf zipsf
          wait
          T=$(( $(date +%s) - T0 )); echo "T_PREPARAR=$T" >> "$GITHUB_ENV"; echo "preparada en $T s"; nproc; free -g
      - name: Renderizar ${{ matrix.id }}
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          PYTHONUNBUFFERED: "1"
        run: python3 herramientas/tp_maquina.py trabajos/TP.json ${{ matrix.id }} salida/${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "trozo-${{ matrix.id }}", path: "salida/${{ matrix.id }}", retention-days: 3, compression-level: 0 }

  unir:
    needs: [plan, trozo]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "U0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { sparse-checkout: "herramientas\ntrabajos" }
      - uses: actions/download-artifact@v4
        with: { path: salida, pattern: "trozo-*" }
      - uses: actions/checkout@v4
        if: needs.plan.outputs.modo == 'render'
        with: { ref: proyecto-tp, path: zipsf }
      - name: Pedazos buenos de un render anterior (si el plan los pide)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY' > /tmp/previos.txt
          import json; d=json.load(open('trabajos/TP.json'))
          print(d.get('sha_previo','')); print(' '.join(t['id'] for t in d.get('previos', [])))
          PY
          SHA=$(sed -n 1p /tmp/previos.txt); IDS=$(sed -n 2p /tmp/previos.txt)
          if [ -n "$IDS" ]; then
            RID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow teletransporte.yml -L 30 --json databaseId,headSha --jq ".[] | select(.headSha==\"$SHA\") | .databaseId" | head -1)
            echo "render anterior: $RID"
            for i in $IDS; do gh run download "$RID" -R "$GITHUB_REPOSITORY" -n "trozo-$i" -D "salida/trozo-$i"; done
            ls salida
          fi
      - name: Unir el video
        run: |
          pip install -q imageio-ffmpeg
          AUD=""
          if [ -d zipsf ]; then
            cat zipsf/tp.zip.* > /tmp/sf.zip && rm -rf zipsf
            unzip -q -j /tmp/sf.zip teletransporte/audio/mezcla.wav -d audio && rm /tmp/sf.zip && AUD=audio
          fi
          python3 herramientas/tp_unir.py trabajos/TP.json salida resultado $AUD
      - name: Guardar en la rama resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p resultado; for f in salida/*/log_*.txt; do [ -f "$f" ] && cp "$f" "resultado/$(basename $(dirname $f))_$(basename $f)"; done
          echo "unir: $(( $(date +%s) - U0 )) s" >> resultado/INFORME.md
          cd resultado; sha256sum *.mp4 > SHA256_videos_enteros.txt 2>/dev/null || true; for f in *.mp4; do [ -f "$f" ] || continue; s=$(stat -c%s "$f"); if [ $s -gt 95000000 ]; then split -b 95000000 -d "$f" "$f.parte" && rm "$f"; fi; done; sha256sum * > SHA256.txt; cd ..
          mv resultado /tmp/resultado
          git sparse-checkout disable
          if git fetch -q --depth=1 origin +refs/heads/resultados:refs/remotes/origin/resultados; then
            git checkout -q -f -B resultados origin/resultados
          else
            git checkout -q --orphan resultados; git rm -rqf --cached . > /dev/null 2>&1 || true
          fi
          N="${{ needs.plan.outputs.nombre }}"; rm -rf "$N"; mkdir -p "$N"; cp /tmp/resultado/* "$N/"
          git add "$N"; git commit -qm "Resultado $N [skip ci]"
          git push -q origin resultados
